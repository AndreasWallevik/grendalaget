<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GRENDALAGET — Offisiell side</title>
  <meta name="description" content="Ny musikk, konserter og nyhetsbrev fra GRENDALAGET." />
  <meta property="og:title" content="GRENDALAGET — Offisiell side" />
  <meta property="og:description" content="Ny musikk, konserter og nyhetsbrev fra GRENDALAGET." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/cover.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{--pad: clamp(16px, 2.5vw, 32px); --accent:#6CCF6A}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background:#0b0b0c; color:#e9e9ee}
    .wrap{min-height:100%; display:grid; grid-template-rows:auto 1fr auto}
    header,footer{padding:var(--pad); opacity:.9}
    main{display:grid; place-items:center; padding:calc(var(--pad)*2)}
    .card{width:min(920px, 100%); border:1px solid #26262b; background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.00)); border-radius:20px; padding:clamp(20px, 4vw, 48px); box-shadow:0 10px 30px rgba(0,0,0,.4)}
    h1{font-size:clamp(32px, 6vw, 64px); margin:0 0 .25em 0; letter-spacing:.5px}
    p.lead{font-size:clamp(16px, 2.2vw, 22px); color:#bfc0c7; margin:0 0 1.25em}
    .links{display:flex; flex-wrap:wrap; gap:8px}
    .btn{display:inline-flex; align-items:center; gap:8px; border:1px solid #34343a; padding:8px 12px; border-radius:10px; text-decoration:none; color:#e9e9ee; background:#141417; font-size:14px; line-height:1}
    .btn:hover{border-color:#52525b; transform:translateY(-1px)}
    .grid{display:grid; gap:5px; grid-template-columns:1fr; margin-top:24px}
    .embed{position:relative; text-align: center; overflow:hidden; border-radius:14px; border:1px solid #26262b; background:#0f0f12}
    .frame{
      width:315px; height:560px; position:relative; overflow:hidden;
      border:1px solid #26262b; border-radius:14px; background:#0f0f12;
      aspect-ratio: 9 / 16;
    }
    .frame iframe{
      position:absolute; inset:0; width:100%; height:100%; border:0; display:block;
  }
    @media (min-width: 820px){ .grid{grid-template-columns:1fr 1fr; } .embed iframe{height:232px} }
    .muted{color:#9b9ca3}
    .site-title{text-align:center;color:var(--accent);font-weight:800;letter-spacing:1px;margin:0 0 12px}
    .hero{width:100%;height:250px;object-fit:cover;border-radius:14px;border:1px solid #26262b;display:block}
    .hero-row{display:grid;grid-template-columns:1fr;gap:12px;margin:8px 0 16px}
    .frame.bc iframe{
      width:700px; height:1100px;
      transform: scale(.47) translate(-4%, -2%);
      transform-origin: top left;
    }
    @media (min-width:700px){.hero-row{grid-template-columns:1fr 1fr}}
    /* Bandcamp fix: make any injected iframe visible and responsive */
    .bandcamp{border:1px solid #26262b; border-radius:14px; overflow:hidden; background:#0f0f12}
    .bandcamp iframe{width:100%; height:360px; display:block}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="muted">GRENDALAGET</div>
    </header>

    <main>
      <section class="card">
        <!-- <h1 class="site-title">Grendalaget</h1> -->

        <!-- Header IMG -->
        <img class="hero" src="assets/grendalaget header_2_small.png" alt="Grendalaget header" loading="lazy" />

        <p class="lead">Grendalaget debuterer med singelen “Sexy” – en melodisk, dreamy banger som setter Hardangerfjord-rap på kartet, en gang for alle. De gjør det sexy i fjorden.</p>

        <!-- Ekstra bilder: GIF + cover side-by-side -->
        <div class="hero-row">
          <img class="hero" src="assets/gifs/3dgifmaker56585.gif" alt="Grendalaget – Sexy animasjon" loading="lazy" />
          <img class="hero" src="assets/sexy_cover.png" alt="Grendalaget – Sexy artwork" loading="lazy" width="1600" height="900" />
        </div>

        <div class="links">
          <!-- <a class="btn" href="https://open.spotify.com/artist/..." target="_blank" rel="noopener">Spotify</a>
          <a class="btn" href="https://music.apple.com/artist/..." target="_blank" rel="noopener">Apple Music</a> -->
          <a class="btn" href="https://www.youtube.com/channel/UCo5ylbdispgQvIe6idXQdEA/posts?pvf=CAI%253D" target="_blank" rel="noopener">YouTube</a>
          <a class="btn" href="mailto:draumstort@gmail.com">Booking</a>
          <a class="btn" href="https://www.instagram.com/grendalaget.rapklubb" target="_blank" rel="noopener">Instagram</a>
          <a class="btn" href="https://grendalaget.bandcamp.com" target="_blank" rel="noopener">Bandcamp</a>
        </div>

       <div class="grid">
          <div class="frame bc">
            <iframe src="https://bandcamp.com/EmbeddedPlayer/track=1320497083/size=large/bgcol=ffffff/linkcol=0687f5/tracklist=false/transparent=true/" loading="lazy"></iframe>
          </div>
          <div class="frame">
            <iframe src="https://www.youtube.com/embed/82P9QYLulWY" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <small class="muted">© <span id="year"></span> GRENDALAGET. Alle rettigheter forbeholdt.</small>
    </footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
