<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GRENDALAGET — Offisiell side</title>
  <meta name="description" content="Ny musikk, konserter og nyhetsbrev fra GRENDALAGET." />
  <meta property="og:title" content="GRENDALAGET — Offisiell side" />
  <meta property="og:description" content="Ny musikk, konserter og nyhetsbrev fra GRENDALAGET." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/sexy3.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{--pad: clamp(16px, 2.5vw, 32px)}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background:#0b0b0c; color:#e9e9ee}
    .wrap{min-height:100%; display:grid; grid-template-rows:auto 1fr auto}
    header,footer{padding:var(--pad); opacity:.9}
    main{display:grid; place-items:center; padding:calc(var(--pad)*2)}
    .card{width:min(920px, 100%); border:1px solid #26262b; background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.00)); border-radius:20px; padding:clamp(20px, 4vw, 48px); box-shadow:0 10px 30px rgba(0,0,0,.4)}
    h1{font-size:clamp(32px, 6vw, 64px); margin:0 0 .25em 0; letter-spacing:.5px}
    p.lead{font-size:clamp(16px, 2.2vw, 22px); color:#bfc0c7; margin:0 0 1.25em}
    .links{display:flex; flex-wrap:wrap; gap:12px}
    .btn{display:inline-flex; align-items:center; gap:8px; border:1px solid #34343a; padding:12px 16px; border-radius:14px; text-decoration:none; color:#e9e9ee; background:#141417}
    .btn:hover{border-color:#52525b; transform:translateY(-1px)}
    .grid{display:grid; gap:16px; grid-template-columns:1fr; margin-top:24px}
    .embed{position:relative; overflow:hidden; border-radius:14px; border:1px solid #26262b}
    .embed iframe{width:100%; height:152px}
    @media (min-width: 820px){ .grid{grid-template-columns:1.2fr .8fr} .embed iframe{height:232px} }
    .muted{color:#9b9ca3}
      .hero{width:100%;max-height:420px;object-fit:cover;border-radius:14px;border:1px solid #26262b;display:block;margin:8px 0 16px}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="muted">GRENDALAGET</div>
    </header>

    <main>
      <section class="card">
        <h1>Grendalaget - Sexy</h1>
        <p class="lead">Grendalaget debuterer med singelen “Sexy” – en melodisk, dreamy banger som setter Hardangerfjord-rap på kartet, en gang for alle. De gjør det sexy i fjorden.</p>

        <!-- Hero-bilde 
        <img class="hero" src="assets/cover.jpg" alt="Grendalaget cover" loading="lazy" width="1600" height="900" /> -->

        <!-- Ekstra bilde -->
        <img class="hero" src="assets/sexy3.png" alt="Grendalaget – Sexy artwork" loading="lazy" width="1600" height="900" />

        <div class="links">
          <a class="btn" href="https://open.spotify.com/artist/..." target="_blank" rel="noopener">Spotify</a>
          <a class="btn" href="https://music.apple.com/artist/..." target="_blank" rel="noopener">Apple Music</a>
          <a class="btn" href="https://www.youtube.com/@..." target="_blank" rel="noopener">YouTube</a>
          <a class="btn" href="mailto:booking@example.com">Booking</a>
          <a class="btn" href="https://instagram.com/..." target="_blank" rel="noopener">Instagram</a>
        </div>

        <div class="grid">
          <div class="embed">
            <!-- Bytt ut med din Spotify-embed (spor/album/artist) -->
            <iframe style="border: 0; width: 100%; height: 120px;" src="https://bandcamp.com/EmbeddedPlayer/track=1320497083/size=large/bgcol=ffffff/linkcol=0687f5/tracklist=false/artwork=small/transparent=true/" seamless><a href="https://grendalaget.bandcamp.com/track/sexy">Sexy by Grendalaget</a></iframe>
          </div>
          <div>
            <!-- <h3>Kommende</h3>
            <p>Legg inn datoer, nyhetsbrev-lenke (Mailchimp/ConvertKit), eller merch.</p>
            <a class="btn" href="#" target="_blank" rel="noopener">Meld meg på nyhetsbrev</a> -->
          </div>
        </div>
      </section>
    </main>

    <footer>
      <small class="muted">© <span id="year"></span> GRENDALAGET. Alle rettigheter forbeholdt.</small>
    </footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
